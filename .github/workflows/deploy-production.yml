name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: orbit-solar-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, deploy-orbit-solar]
    timeout-minutes: 30
    steps:
      - name: Build and deploy commit
        run: sudo -n /usr/local/sbin/deploy-orbit-solar "$GITHUB_SHA"
